# version: "3.9"

services:
  s_autoware:
    extends:
      file: ../../common/base.yml
      service: b_common_base
    privileged: true
    container_name: c_autoware
    image: i_autoware:latest
    build:
      context: .
      dockerfile: Dockerfile
    # Autoware 推奨の追加環境変数
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - QT_X11_NO_MITSHM=1
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - CUDA_HOME=/usr/local/cuda
      - PATH=$CUDA_HOME/bin:$PATH
      - LD_LIBRARY_PATH=/usr/local/cuda/lib64:/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH
      - CUTILS_LOGGING_SEVERITY=DEBUG
      - CUDA_LAUNCH_BLOCKING=1

    # Autoware のデータをホストと共有
    volumes:
      - ../../common/autoware_data:/root/autoware_data:rw

    # Autoware 起動（例：AWSIM 連携）
    command: ["bash"]
